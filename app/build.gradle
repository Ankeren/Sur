plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sur.player'
    // 33 is the highest API level AGP 7.3.1 / Android Studio Dolphin supports.
    compileSdk 33

    defaultConfig {
        applicationId "com.sur.player"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // View binding generates a class per layout file, so we never call findViewById.
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Room is a thin layer over SQLite. The Song class is already annotated
    // as a table; the DAOs and the database class come next.
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'
}
